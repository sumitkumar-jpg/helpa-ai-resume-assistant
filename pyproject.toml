[project]
name = "helpa-ai-resume-assistant"
version = "1.0.0"
description = "An AI-powered resume assistant that enables recruiters to chat with a resume 
and compare it with uploaded job descriptions."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]
